# Test profile — infrastructure comes from Testcontainers (@ServiceConnection),
# so no host/port/credentials are set here; they are injected at runtime.
spring:
  # Run schema.sql against the container before Hibernate validates the mapping.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      # The container starts empty; schema.sql owns the DDL, Hibernate only validates.
      ddl-auto: validate
    # Ensure schema.sql runs before Hibernate inspects the tables.
    defer-datasource-initialization: false
    open-in-view: false
  kafka:
    topic:
      name: my-topic
    consumer:
      # Read from the start so a message produced during the test is not missed.
      auto-offset-reset: earliest

cache:
  ttl: 10m
  payments:
    name: payments

management:
  tracing:
    export:
      enabled: false        # do not export spans (nothing is sent to a collector)
    sampling:
      probability: 0.0      # belt-and-suspenders: sample nothing, so no spans are recorded
  otlp:
    metrics:
      export:
        enabled: false      # do not push metrics over OTLP