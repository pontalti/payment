server:
  port: 8080
spring:
  application:
    name: payment
  cache:
    type: redis

# PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: app
    password: app
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update          # use 'update' só em dev inicial; prefira Flyway/Liquibase
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

# Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: app
      repositories:
        enabled: false

# Kafka
  kafka:
    topic:
      name: my-topic
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      isolation-level: read-committed
      enable-auto-commit: true
      
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
      properties:
        enable:
          idempotence: true
        max-in-flight-requests-per-connection: 5

cache:
  ttl: 10m
  payments:
    name: payments

# Swagger UI at http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

info:
  app:
    name: Payment
    description: Payment service - Spring Boot Actuator
    version: 1.0.0

management:
  server:
    port: 8081
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"