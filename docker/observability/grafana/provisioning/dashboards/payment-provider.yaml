apiVersion: 1

# Tells the Grafana bundled inside grafana/otel-lgtm to load every dashboard JSON
# found in the `custom` folder. The compose file mounts our dashboards there.
providers:
  - name: "Payment Dashboards"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /otel-lgtm/grafana/conf/provisioning/dashboards/custom
      foldersFromFilesStructure: false
