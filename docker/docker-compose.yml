# docker/docker-compose.yml
# Root file that starts the whole development infrastructure
# (Postgres + pgAdmin, Kafka + Kafka-UI, Redis + RedisInsight, LGTM observability)
# by combining the separate compose files via the `include` directive.
#
# Requires Docker Compose v2.20+ (recent Docker Desktop / Engine).
#
# Usage (from the docker/ folder):
#   docker compose up -d          # start everything
#   docker compose ps             # status
#   docker compose logs -f kafka  # logs of a single service
#   docker compose down           # stop everything (volumes kept)
#   docker compose down -v        # stop everything and wipe the volumes

name: dev-infra

include:
  - postgres/docker-compose.yml
  - kafka/docker-compose.yml
  - redis/docker-compose.yml
  - observability/docker-compose.yml